plugins { id 'net.fabricmc.fabric-loom' version '1.17.21' }
version = '0.2.2'
group = 'com.entegrevesselam'
base { archivesName = 'entegre-markers' }
repositories { maven { url = 'https://api.modrinth.com/maven' } }
// Xaero embeds its required library; Loom development runs do not load nested jars automatically.
configurations { xaeroBundle { transitive = false } }
dependencies { xaeroBundle 'maven.modrinth:xaeros-minimap:B2aG1aya' }
def xaeroLibDirectory = file('.gradle/xaero-library')
def xaeroLib = new File(xaeroLibDirectory, 'xaerolib-fabric-26.3-1.7.17.jar')
if (!xaeroLib.exists()) {
    copy {
        from zipTree(configurations.xaeroBundle.singleFile)
        include 'META-INF/jars/xaerolib-fabric-26.3-1.7.17.jar'
        eachFile { path = name }
        includeEmptyDirs = false
        into xaeroLibDirectory
    }
}
dependencies {
    localRuntime files(xaeroLib)
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.163.0+26.3'
    compileOnly('maven.modrinth:fancymenu:CBLbyHzH') { transitive = false }
    compileOnly 'maven.modrinth:xaeros-minimap:B2aG1aya'
    compileOnly 'maven.modrinth:xaeros-world-map:nz9xjzWi'
    localRuntime 'maven.modrinth:xaeros-minimap:B2aG1aya'
    localRuntime 'maven.modrinth:xaeros-world-map:nz9xjzWi'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
tasks.register('contractTest', JavaExec) { dependsOn testClasses; classpath = sourceSets.test.runtimeClasspath; mainClass = 'com.entegrevesselam.markers.ContractTests'; enableAssertions = true }
check.dependsOn contractTest

// Assertions run through contractTest; this module intentionally has no JUnit dependency.
tasks.named("test") { dependsOn contractTest; failOnNoDiscoveredTests = false }

// A separate source set keeps the real-client command probe out of both published JARs.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        entegre_markers { sourceSet sourceSets.main }
        entegre_markers_smoke { sourceSet sourceSets.smoke }
    }
    runs {
        smoke {
            client()
            source sourceSets.smoke
            runDir 'run-26.3'
        }
    }
}
